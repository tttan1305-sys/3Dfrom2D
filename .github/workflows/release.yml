name: Release (auto-update)

# Publishes a signed GitHub Release that installed apps pick up automatically.
# Start it either by pushing a tag like v0.2.0, or from the Actions tab
# ("Run workflow") by typing the new version number.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Phiên bản mới, ví dụ 0.2.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ""
          - os: macos-latest
            args: "--target universal-apple-darwin"
          - os: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: Install Linux system libraries
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Set version
        shell: bash
        run: |
          VERSION="${{ github.event.inputs.version }}"
          [ -z "$VERSION" ] && VERSION="${GITHUB_REF_NAME#v}"
          node scripts/set-version.mjs "$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: v${{ env.VERSION }}
          releaseName: 3Dfrom2D v${{ env.VERSION }}
          releaseBody: "Tải file cài đặt bên dưới. Ứng dụng đã cài sẽ tự hỏi cập nhật khi mở."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
