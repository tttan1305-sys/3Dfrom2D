[package]
name = "app3dfrom2d"
version = "0.1.0"
description = "Phần mềm dựng 3D từ phác thảo 2D"
edition = "2021"

[lib]
name = "app3dfrom2d_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
